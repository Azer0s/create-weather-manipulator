plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    // ModDevGradle, the officially recommended NeoForge build plugin.
    id 'net.neoforged.moddev' version '2.0.78'
}

version = "${mod_version}-mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

// Datagen output (produced by `./gradlew runData`) is part of the mod resources.
sourceSets.main.resources.srcDir 'src/generated/resources'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

repositories {
    mavenCentral()
    // Create, Ponder, Catnip, Flywheel are published here.
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
    }
    // Registrate (Create's registration helper) for MC 1.21+.
    maven {
        name = 'IThundxr'
        url = 'https://maven.ithundxr.dev/snapshots'
    }
    // JEI (optional compile-time integration; not required to build the mod).
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    // EMI
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
    // ComputerCraft: Tweaked
    maven {
        name = 'SquidDev'
        url = 'https://maven.squiddev.cc'
    }
    // KubeJS + Rhino
    maven {
        name = 'Saps'
        url = 'https://maven.saps.dev/releases'
    }
    // Architectury (KubeJS transitive)
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
}

neoForge {
    version = neo_version

    // Optional but recommended: Parchment human-readable parameter names.
    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    // Load Create's assets so model/texture validation can see them.
                    '--existing-mod', 'create')
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// ---------------------------------------------------------------------------
// Create + its dependency stack.
//
// The `:slim` classifier pulls Create without its bundled optional integration
// mods (JEI, FTB, JourneyMap, Curios, ...); the required runtime dependencies
// that Create was split into (Flywheel, Registrate, Ponder, Catnip) are then
// declared explicitly. Coordinates/versions match Create 6.0.10's own build.
// ---------------------------------------------------------------------------
dependencies {
    implementation("com.simibubi.create:create-${create_minecraft_version}:${create_version}:slim") {
        transitive = false
    }

    implementation "dev.engine-room.flywheel:flywheel-neoforge-${create_minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    // Ponder bundles Catnip (net.createmod.catnip.*) directly, so we do NOT
    // declare Catnip separately; doing so produces a split-package / duplicate
    // JPMS module conflict at runtime.
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}"

    // --- Optional mod integrations (compile-only APIs) ------------------
    // The mod runs fine without any of these installed; integration classes
    // are guarded so they only load when the corresponding mod is present.
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-forge-api:${cc_version}"
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") {
        transitive = false
    }
}

// Interpolate mod metadata into neoforge.mods.toml.
final Map<String, String> replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        create_version         : create_version,
        create_mod_version_range: create_mod_version_range,
]

tasks.withType(ProcessResources).configureEach {
    var replaceProps = replaceProperties
    inputs.properties replaceProps
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProps + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}
