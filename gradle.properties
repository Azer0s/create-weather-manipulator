# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# Mod
mod_id=weatherinducer
mod_name=Weather Inducer
mod_license=MIT
mod_version=1.0.0
mod_group_id=at.simulevski.weatherinducer
mod_authors=Ariel Simulevski
mod_description=A Create addon that adds a kinetic Weather Inducer (rain / clear / lightning) and an SU Resistor to throttle SU throughput.

# Platform versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.233
neo_version_range=[21.1.0,)
loader_version_range=[4,)
java_version=21

# Create + its dependency stack (resolved against the live Maven repos).
# Create publishes with a build-number suffix; 6.0.10-281 is the last 6.0.10 build.
create_minecraft_version=1.21.1
create_version=6.0.10-281
# Version required at runtime in neoforge.mods.toml (the Create MOD version, which
# is 6.0.10 without the maven build suffix).
create_mod_version_range=[6.0,)
# Create's split-out runtime dependencies (versions taken from Create 6.0.10's build).
registrate_version=MC1.21-1.3.0+67
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6-42
catnip_version=0.8.54
